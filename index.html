<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salmos — Inicio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { paper: '#faf9f7', ink: '#1e293b', ochre: '#a16207', ochredeep: '#854d0e' },
        fontFamily: {
          serif: ['"Source Serif 4"', 'Georgia', 'serif'],
          sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif']
        }
      }
    }
  }
</script>
<style>
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .label { font-size: 0.625rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
</style>
<link rel="stylesheet" href="nav.css">
</head>
<body class="bg-paper text-ink font-sans antialiased">
<div id="nav-root"></div>

<div class="max-w-[900px] mx-auto px-6 md:px-8 py-10">
  <header class="border-b border-neutral-200 pb-6 mb-8">
    <p class="label text-ochre mb-3">Curso bíblico</p>
    <h1 class="font-serif font-bold text-4xl md:text-5xl leading-tight text-ink">Salmos</h1>
    <p class="font-serif italic text-lg text-neutral-600 mt-2">Seis materiales del curso. Elige uno para empezar.</p>
  </header>

  <div id="home-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
</div>

<script src="nav.js"></script>
</body>
</html>
